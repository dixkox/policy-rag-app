<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Policy RAG App</title>
  <style>
    body { font-family: Arial; margin: 40px; background: #f7f7f7; }
    #container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 10px; }
    textarea { width: 100%; height: 120px; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; cursor: pointer; }
    #answer { margin-top: 20px; white-space: pre-wrap; background: #eee; padding: 20px; border-radius: 10px; }
    #loading { margin-top: 10px; font-style: italic; color: #555; }
    #error { margin-top: 10px; color: red; font-weight: bold; }
  </style>
</head>
<body>
  <div id="container">
    <h2>Policy RAG App</h2>
    <p>Ask any question about company policies:</p>

    <textarea id="question" placeholder="e.g., What is the PTO policy?"></textarea>
    <button onclick="ask()">Ask</button>

    <div id="loading"></div>
    <div id="error"></div>

    <h3>Answer:</h3>
    <div id="answer"></div>
  </div>

  <!-- Load your JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
